app {
  http {
    host = "0.0.0.0"
    port = 8081
    timeout = 40 seconds
  }

  one-frame {
    base-uri = ${?ONE_FRAME_BASE_URI} or "http://localhost:8080"
    auth-token = ${?ONE_FRAME_TOKEN} or ""
    timeout = 10 seconds
  }

  cache {
    ttl = 5 minutes                   # Hard freshness ceiling; must not exceed the 5-minute SLA.
    soft-ttl = 4 minutes              # Serve stale + trigger background revalidation above this age.
    max-stale-on-error = 5 minutes    # Matches SLA. Raise to e.g. 10 minutes to serve during outages instead of 502
  }

  rate-limiter {
    max-requests-per-minute = 100
  }
}
