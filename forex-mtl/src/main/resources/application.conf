app {
  http {
    host = "0.0.0.0"
    port = 8081
    timeout = 40 seconds
  }

  one-frame {
    base-uri = "http://localhost:8080"
    base-uri = ${?ONE_FRAME_BASE_URI}

    auth-token = ""
    auth-token = ${?ONE_FRAME_TOKEN}

    timeout = 10 seconds
  }

  cache {
    ttl = 5 minutes                   # Hard freshness ceiling; must not exceed the 5-minute SLA.
    soft-ttl = 4 minutes              # Serve stale + trigger background revalidation above this age.
    max-stale-on-error = 5 minutes    # Matches the SLA by default. Raise to e.g. 10 minutes to serve
                                      # slightly stale rates during One-Frame outages instead of 502.
  }
}
